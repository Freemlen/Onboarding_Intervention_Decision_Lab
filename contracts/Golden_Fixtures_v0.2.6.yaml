balance_fixture_contract:
  method_id: OIDL-PRE-T0-BALANCE-SMD
  method_version: 1.0.0
  rule_reference: SAP section 4.3
  numeric_tolerance: EXACT correctly rounded binary64, ties-to-even; exact canonical zero, all integer/Boolean/null/label/status
    fields and array order. General float_absolute_tolerance does NOT apply.
  non_product_code: Explicit inputs and expected data only; no implementation code or canonical seed.
  direct_fixture_scope: Single-variable cases exercise one catalogue source without changing the full-output requirement
    of three scopes and all seven fields. Scope and failure fixtures test the full logical projection. Existing
    canonical data/release checks are separate.
  mutation_notation: Paths are lists of exact map keys and zero-based array indices. REMOVE deletes the key or
    array item; REPLACE replaces its value. Other named operations are defined by each case meaning. expected_balance_diagnostics
    paths target candidate outputs, never input data. Failure tests check detection of the named issue, not canonical
    quotas; preserve original good input/output snapshots for each independent case.
  data_limits: No new missing-data state is introduced. Excluded rows are omitted by valid assigned-population
